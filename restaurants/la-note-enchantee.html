<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>La note enchantée - OhMyFood</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Shrikhand&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../assets/css/restaurants.css" />
</head>

<header>
  <a href="../index.html" class="back-arrow" aria-label="Retour à l'accueil">
    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M20 12H4M10 18L4 12L10 6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </a>

  <img
    class="logo"
    src="/assets/images/logo/ohmyfood.png"
    alt="logo-ohmyfood"
  />
</header>

<section class="photo-restau">
  <img
    src="/assets/images/restaurants/stil-u2Lp8tXIcjw-unsplash.jpg"
    alt="La note enchantée"
  />
</section>

<section class="menus">
  <div class="hero-menus">
    <h2>La note enchantée du goût</h2>

    <div class="heart">
      <input type="checkbox" id="heart-menu" />

      <label for="heart-menu">
        <i class="fa-regular fa-heart heart-empty"></i>
        <i class="fa-solid fa-heart heart-full"></i>
      </label>
    </div>
  </div>

  <div class="part-menu menu-appear delay-1">
    <h2 class="menu-title">Entrées</h2>
    <div class="cards-menu">
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Ravioles de foie gras</h3>
          <p>Accompagnées de leur crème à la truffe</p>
        </div>
        <div class="price">
          <p>25€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Caviar osciètre</h3>
          <p>Sur blini à la farine de blé noir</p>
        </div>
        <div class="price">
          <p>35€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>

      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Homard et espuma de potiron</h3>
          <p>Marinés aux zestes d'orange</p>
        </div>
        <div class="price">
          <p>20€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>

      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Foie gras de canard cuit entier</h3>
          <p>Confiture de figue et pain toasté</p>
        </div>
        <div class="price">
          <p>35€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
    </div>
  </div>

  <div class="part-menu menu-appear delay-2">
    <h2 class="menu-title">Plats</h2>
    <div class="cards-menu">
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Noix de coquilles Saint-Jacques</h3>
          <p>Sur lit de purée de céleri-rave</p>
        </div>
        <div class="price">
          <p>40€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Langoustine poêlée</h3>
          <p>Purée de patate douce</p>
        </div>
        <div class="price">
          <p>35€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>

      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Mijoté de queue de bœuf</h3>
          <p>Et riz sauvage aux zestes de citron</p>
        </div>
        <div class="price">
          <p>45€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
    </div>
  </div>

  <div class="part-menu menu-appear delay-3">
    <h2 class="menu-title">Desserts</h2>
    <div class="cards-menu">
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Macaron noisette et chocolat</h3>
          <p>Glace au caramel brun et sel de Guérande</p>
        </div>
        <div class="price">
          <p>18€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Baba au rhum revisité</h3>
          <p>Avec son coulis de citron</p>
        </div>
        <div class="price">
          <p>22€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>

      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Tarte au citron meringuée</h3>
          <p>Déstructurée</p>
        </div>
        <div class="price">
          <p>23€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
    </div>
  </div>

  <div class="cta">
    <button class="command-btn">Commander</button>
  </div>
</section>

<footer>
  <div class="footer-content">
    <p class="footer-logo">ohmyfood</p>

    <ul>
      <li>
        <a href="#">
          <i class="fa-solid fa-utensils"></i>
          Proposer un restaurant
        </a>
      </li>

      <li>
        <a href="#">
          <i class="fa-solid fa-handshake-angle"></i>
          Devenir partenaire
        </a>
      </li>

      <li>
        <a href="#">Mentions légales</a>
      </li>

      <li>
        <a href="mailto:contact@ohmyfood.com">Contact</a>
      </li>
    </ul>
  </div>
</footer>
