<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>À la française - OhMyFood</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Shrikhand&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../assets/css/restaurants.css" />
</head>

<header>
  <a href="../index.html" class="back-arrow" aria-label="Retour à l'accueil">
    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M20 12H4M10 18L4 12L10 6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </a>

  <img
    class="logo"
    src="/assets/images/logo/ohmyfood.png"
    alt="logo-ohmyfood"
  />
</header>

<section class="photo-restau">
  <img
    src="/assets/images/restaurants/toa-heftiba-DQKerTsQwi0-unsplash.jpg"
    alt="À la française"
  />
</section>

<section class="menus">
  <div class="hero-menus">
    <h2>À la française</h2>

    <div class="heart">
      <input type="checkbox" id="heart-menu" />

      <label for="heart-menu">
        <i class="fa-regular fa-heart heart-empty"></i>
        <i class="fa-solid fa-heart heart-full"></i>
      </label>
    </div>
  </div>

  <div class="part-menu">
    <h2 class="menu-title">Entrées</h2>
    <div class="cards-menu">
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Tartare de poulpe acidulé</h3>
          <p>Aux zestes d'orange</p>
        </div>
        <div class="price">
          <p>25€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Velouté de légumes d'antan</h3>
          <p>Carotte, panais, topinambour</p>
        </div>
        <div class="price">
          <p>35€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>

      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Soupe à l'oignon</h3>
          <p>Revisitée</p>
        </div>
        <div class="price">
          <p>20€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
    </div>
  </div>

  <div class="part-menu">
    <h2 class="menu-title">Plats</h2>
    <div class="cards-menu">
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Coquilles Saint-Jacques</h3>
          <p>Accompagnées d'une purée de panais</p>
        </div>
        <div class="price">
          <p>40€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>

      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Magret de canard</h3>
          <p>Et parmentier de pommes de terre</p>
        </div>
        <div class="price">
          <p>35€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>

      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Pigeonneau d’Ille-et-Vilaine</h3>
          <p>Sur son lit de gnocchis aux légumes</p>
        </div>
        <div class="price">
          <p>44€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
    </div>
  </div>

  <div class="part-menu">
    <h2 class="menu-title">Desserts</h2>
    <div class="cards-menu">
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Pétales de violettes glacés</h3>
          <p>Et purée de noisettes</p>
        </div>
        <div class="price">
          <p>18€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Fondant au chocolat</h3>
          <p>Revisité</p>
        </div>
        <div class="price">
          <p>22€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>

      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Millefeuille croustillant</h3>
          <p>Myrtilles et pâte d’amande</p>
        </div>
        <div class="price">
          <p>23€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
    </div>
  </div>

  <div class="cta">
    <button class="command-btn">Commander</button>
  </div>
</section>

<footer>
  <div class="footer-content">
    <p class="footer-logo">ohmyfood</p>

    <ul>
      <li>
        <a href="#">
          <i class="fa-solid fa-utensils"></i>
          Proposer un restaurant
        </a>
      </li>

      <li>
        <a href="#">
          <i class="fa-solid fa-handshake-angle"></i>
          Devenir partenaire
        </a>
      </li>

      <li>
        <a href="#">Mentions légales</a>
      </li>

      <li>
        <a href="mailto:contact@ohmyfood.com">Contact</a>
      </li>
    </ul>
  </div>
</footer>
