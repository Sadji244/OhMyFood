<head>

  />

    rel="stylesheet"
  />

  <link rel="stylesheet" href="../assets/css/restaurants.css" />

<header>
  <a href="../index.html" class="back-arrow" aria-label="Retour à l'accueil">
    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M20 12H4M10 18L4 12L10 6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </a>

  <img
    class="logo"
    src="/assets/images/logo/ohmyfood.png"
    alt="logo-ohmyfood"
  />
</header>

<section class="photo-restau">
  <img
    src="/assets/images/restaurants/louis-hansel-shotsoflouis-qNBGVyOCY8Q-unsplash.jpg"
    alt="Le délice des sens"
  />
</section>

<section class="menus">
  <div class="hero-menus">
    <h2>Le délice des sens</h2>

    <div class="heart">
      <input type="checkbox" id="heart-menu" />

      <label for="heart-menu">
        <i class="fa-regular fa-heart heart-empty"></i>
        <i class="fa-solid fa-heart heart-full"></i>
      </label>
    </div>
  </div>

  <div class="part-menu menu-appear delay-1">
    <h2 class="menu-title">Entrées</h2>
    <div class="cards-menu">
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Tartare de thon</h3>
          <p>Assaisonné au yuzu</p>
        </div>
        <div class="price">
          <p>25€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Bouchée de homard croustillant</h3>
          <p>Et sa farandole de petits légumes</p>
        </div>
        <div class="price">
          <p>35€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>

      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Poulet rôti aux herbes de Provence</h3>
          <p>Et sa crème de truffe</p>
        </div>
        <div class="price">
          <p>40€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
    </div>
  </div>

  <div class="part-menu menu-appear delay-2">
    <h2 class="menu-title">Plats</h2>
    <div class="cards-menu">
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Poulet rôti aux herbes de Provence</h3>
          <p>Et sa crème de truffe</p>
        </div>
        <div class="price">
          <p>40€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Langouste rôtie</h3>
          <p>Et ses légumes de saison</p>
        </div>
        <div class="price">
          <p>35€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>

      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Côte de bœuf Angus</h3>
          <p>Et sa purée de panais</p>
        </div>
        <div class="price">
          <p>44€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
    </div>
  </div>

  <div class="part-menu menu-appear delay-3">
    <h2 class="menu-title">Desserts</h2>
    <div class="cards-menu">
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Farandole de desserts</h3>
          <p>Du chef</p>
        </div>
        <div class="price">
          <p>18€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Crème brulée</h3>
          <p>Revisitée</p>
        </div>
        <div class="price">
          <p>22€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>

      <label class="cards-assiette">
        <input type="checkbox" class="toggle-price" />
        <div class="menu-name">
          <h3>Tiramisu</h3>
          <p>À la noisette</p>
        </div>
        <div class="price">
          <p>23€</p>
        </div>

        <div class="choisir">
          <span class="material-symbols-outlined"> check_circle </span>
        </div>
      </label>
    </div>
  </div>

  <div class="cta">
    <button class="command-btn">Commander</button>
  </div>
</section>
