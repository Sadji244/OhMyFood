<!DOCTYPE html>
<html lang="fr">
    

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OhMyFood</title>
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>


    <header>
        <img class="logo" src="./assets/images/logo/ohmyfood.png" alt="logo-ohmyfood">
    </header>

    <main>
        <section class="page-hero">
            <div class="hero-location">
                <i class="fa-solid fa-location-dot"></i>
                <p>Paris, Belleville</p>
            </div>

            <div class="hero">
                <h1>Réservez le menu qui vous convient</h1>
                <p>Découvrez des restaurants d’exception, sélectionnés par nos soins.</p>
                <button>Explorer nos restaurants</button>
            </div>
        </section>

        <section class="fonctionnement">
            <h2>Fonctionnement</h2>
            <div class="ft-option">
                <article class="ft-card">
                    <div class="circle">
                        <p>1</p>
                    </div>
                    <div class="ft-content">
                        <i class="fa-solid fa-mobile-screen-button"></i>
                        <h3>Choisissez un restaurant</h3>
                    </div>
                </article>

                <article class="ft-card">
                    <div class="circle">
                        <p>2</p>
                    </div>
                    <div class="ft-content">
                        <i class="fa-solid fa-list"></i>
                        <h3>Composez votre menu</h3>
                    </div>
                </article>

                <article class="ft-card">
                    <div class="circle">
                        <p>3</p>
                    </div>
                    <div class="ft-content">
                        <i class="fa-solid fa-store"></i>
                        <h3>Dégustez au restaurant</h3>
                    </div>
                </article>
            </div>
        </section>

        <section class="restaurants">
            <div class="restaurant-content">
            <h2>Restaurants</h2>
            <div class="resto-list">
                <article class="resto-card">

                </article>
            </div>
            </div>
        </section>

    </main>

</body>

</html>
